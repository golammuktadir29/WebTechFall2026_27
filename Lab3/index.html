<html>
  <head>
    <title>Seventeen Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Registration Form</h1>

    <form>
      <div>
        <label for="fullname">Full Name:</label>
        <input type="text" name="fullname" id="fullname" required />
      </div>
      <br />

      <div>
        <label for="email">Email:</label>
        <input type="text" name="email" id="email" />
      </div>
      <br />

      <div>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" />
      </div>
      <br />

      <div>
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" />
      </div>
      <br />

      <div>
        <label for="photo">Choose Your Photo:</label>
        <input type="file" name="photo" id="photo" />
      </div>
      <br />

      <div>
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male" /> Male
        <input type="radio" name="gender" value="Female" /> Female
      </div>
      <br />

      <div>
        <label>Religion:</label>
        <input type="checkbox" name="r1" value="Islam" checked /> Islam
        <input type="checkbox" name="r2" value="Christian" /> Christian
        <input type="checkbox" name="r3" value="Hindu" /> Hindu
      </div>
      <br />

      <div>
        <label for="department">Department:</label>
        <select name="department" id="department">
          <option value="IPE">IPE</option>
          <option value="CSE" selected>CSE</option>
          <option value="EEE">EEE</option>
        </select>
      </div>
      <br />

      <div>
        <label for="address">Address:</label>
        <textarea id="address" cols="30" rows="5"></textarea>
      </div>
      <br />

      <div>
        <input type="submit" value="Register" />
        <input type="reset" value="Clear" />
      </div>
    </form>
  </body>
</html>
